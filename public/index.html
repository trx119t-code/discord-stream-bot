!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Cinema</title>
    <!-- تضمين سكريبت ديسكورد الرسمي المعتمد -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.1.0/output/index.js"></script>
    <style>
        :root {
            --primary: #FF2228;
            --primary-hover: #B8202A;
            --bg-main: #0F0A0D;
            --bg-surface: #151316;
            --card-bg: #2B171D;
            --card-hover: #341920;
            --border-color: #5E3B46;
            --text-main: #FFF5F5;
            --text-muted: #D8CAD0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(15, 10, 13, 0.95) 100%);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 12px rgba(255, 34, 40, 0.4);
        }

        .search-box {
            display: flex;
            gap: 10px;
            width: 50%;
            max-width: 480px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--primary-hover);
        }

        /* نافذة التحكم بالعرض */
        #media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 10, 13, 0.92);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            max-width: 520px;
            width: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .modal-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-row label {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .control-row select {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            outline: none;
            font-weight: bold;
            width: 60%;
        }

        .launch-btn {
            background: var(--primary);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.05rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 34, 40, 0.4);
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .launch-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .copy-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.9rem;
            text-align: center;
        }

        .copy-btn:hover {
            color: var(--text-main);
            border-color: var(--primary);
        }

        .content-area {
            padding: 24px 28px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: var(--text-main);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, background 0.25s;
        }

        .movie-card:hover {
            transform: translateY(-6px);
            background: var(--card-hover);
            border-color: var(--primary);
        }

        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .movie-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .rating-badge {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍿 Orbit Cinema</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="performSearch()">بحث</button>
        </div>
    </header>

    <!-- نافذة العرض المنبثقة -->
    <div id="media-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div id="modalTitle" class="modal-title">عنوان العمل</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>

            <div class="modal-controls">
                <div id="seriesFields" style="display:none; flex-direction:column; gap:10px;">
                    <div class="control-row">
                        <label>الموسم:</label>
                        <select id="seasonSelect" onchange="updateLinks()"></select>
                    </div>
                    <div class="control-row">
                        <label>الحلقة:</label>
                        <select id="episodeSelect" onchange="updateLinks()"></select>
                    </div>
                </div>

                <div class="control-row">
                    <label>السيرفر:</label>
                    <select id="serverSelect" onchange="updateLinks()">
                        <option value="vidlink">سيرفر 1 (VidLink - جودة 1080p + CC)</option>
                        <option value="embedsu">سيرفر 2 (Embed.su - ترجمة تلقائية)</option>
                        <option value="vidsrc">سيرفر 3 (VidSrc Pro)</option>
                    </select>
                </div>

                <button class="launch-btn" onclick="startPlayback()">▶ بدء المشاهدة الفورية</button>
                <button class="copy-btn" onclick="copyCurrentLink()">📋 نسخ الرابط للمشاركة بالروم</button>
            </div>
        </div>
    </div>

    <main class="content-area">
        <h2 class="section-title" id="gridTitle">الأفلام والمسلسلات الرائجة الآن</h2>
        <div class="movies-grid" id="moviesGrid">
            <p style="color:var(--text-muted); padding:20px;">جاري تحميل العروض...</p>
        </div>
    </main>

    <script>
        let discordSdk = null;
        let activeItem = { id: null, isTv: false, title: '' };
        let generatedStreamUrl = '';

        // تهيئة ربط Discord SDK الرسمي
        async function setupDiscord() {
            try {
                if (window.DiscordSDK) {
                    discordSdk = new window.DiscordSDK.DiscordSDK();
                    await discordSdk.ready();
                }
            } catch (e) {
                console.log("Discord SDK ready bypass");
            }
        }
        setupDiscord();

        function renderCards(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">لا توجد نتائج متاحة.</p>';
                return;
            }

            items.filter(i => i.media_type !== 'person' && i.poster_path).forEach(item => {
                const isTv = item.media_type === 'tv' || (!item.title && item.name);
                const title = item.title || item.name;
                const year = (item.release_date || item.first_air_date || '').split('-')[0] || '----';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '0';
                const poster = `/api/image?path=${encodeURIComponent(item.poster_path)}`;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${poster}" alt="${title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span>${isTv ? 'مسلسل' : 'فيلم'} • ${year}</span>
                            <span class="rating-badge">⭐ ${rating}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => openModal(item.id, isTv, title);
                grid.appendChild(card);
            });
        }

        async function fetchTrendingContent() {
            try {
                const res = await fetch('/api/trending');
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    renderCards(data.results);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.results) renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        function openModal(id, isTv, title) {
            activeItem = { id, isTv, title };
            document.getElementById('modalTitle').innerText = title;

            const seriesBlock = document.getElementById('seriesFields');
            if (isTv) {
                seriesBlock.style.display = 'flex';
                initSeriesSelectors();
            } else {
                seriesBlock.style.display = 'none';
            }

            updateLinks();
            document.getElementById('media-modal').style.display = 'flex';
        }

        function initSeriesSelectors() {
            const sSelect = document.getElementById('seasonSelect');
            const eSelect = document.getElementById('episodeSelect');
            
            sSelect.innerHTML = '';
            for (let s = 1; s <= 15; s++) {
                sSelect.innerHTML += `<option value="${s}">الموسم ${s}</option>`;
            }

            eSelect.innerHTML = '';
            for (let e = 1; e <= 30; e++) {
                eSelect.innerHTML += `<option value="${e}">الحلقة ${e}</option>`;
            }
        }

        function updateLinks() {
            const server = document.getElementById('serverSelect').value;
            const season = document.getElementById('seasonSelect').value || 1;
            const episode = document.getElementById('episodeSelect').value || 1;

            if (activeItem.isTv) {
                if (server === 'vidlink') {
                    generatedStreamUrl = `https://vidlink.pro/tv/${activeItem.id}/${season}/${episode}`;
                } else if (server === 'embedsu') {
                    generatedStreamUrl = `https://embed.su/embed/tv/${activeItem.id}/${season}/${episode}`;
                } else {
                    generatedStreamUrl = `https://vidsrc.in/embed/tv?tmdb=${activeItem.id}&season=${season}&episode=${episode}`;
                }
            } else {
                if (server === 'vidlink') {
                    generatedStreamUrl = `https://vidlink.pro/movie/${activeItem.id}`;
                } else if (server === 'embedsu') {
                    generatedStreamUrl = `https://embed.su/embed/movie/${activeItem.id}`;
                } else {
                    generatedStreamUrl = `https://vidsrc.in/embed/movie?tmdb=${activeItem.id}`;
                }
            }
        }

        async function startPlayback() {
            if (!generatedStreamUrl) return;

            // 1. استخدام أمر Discord SDK الرسمي لفتح المشغل
            try {
                if (discordSdk && discordSdk.commands && discordSdk.commands.openExternalLink) {
                    await discordSdk.commands.openExternalLink({ url: generatedStreamUrl });
                    return;
                }
            } catch (err) {
                console.log("Discord open link direct:", err);
            }

            // 2. الفتح التلقائي المباشر
            window.open(generatedStreamUrl, '_blank');
        }

        function copyCurrentLink() {
            if (!generatedStreamUrl) return;
            navigator.clipboard.writeText(generatedStreamUrl).then(() => {
                alert('✅ تم نسخ رابط العرض! أرسله في الروم الصوتي وابدأ المشاهدة.');
            }).catch(() => {
                prompt('انسخ الرابط:', generatedStreamUrl);
            });
        }

        function closeModal() {
            document.getElementById('media-modal').style.display = 'none';
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        fetchTrendingContent();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Cinema</title>
    <!-- استدعاء Discord Embedded App SDK الرسمي -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.1.0/output/index.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* شريط علوي */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #5865f2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            width: 50%;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #2b2d31;
            background: #1e1f22;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #5865f2;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: #4752c4;
        }

        /* نافذة مشغل الفيديو */
        #player-container {
            display: none;
            width: 100%;
            background: #000;
            padding: 10px 24px 20px 24px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .close-btn {
            background: #ed4245;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 65vh;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* شبكة عرض الأفلام */
        .content-area {
            padding: 20px 24px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #dbdee1;
            font-weight: 700;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .movie-card {
            background: #1e1f22;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .movie-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            font-size: 0.75rem;
            color: #949ba4;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍿 Orbit Cinema</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="performSearch()">بحث</button>
        </div>
    </header>

    <!-- منطقة تشغيل الفيديو -->
    <div id="player-container">
        <div class="player-header">
            <h3 id="currentPlayingTitle">جاري المشاهدة...</h3>
            <button class="close-btn" onclick="closePlayer()">إغلاق المشغل ✕</button>
        </div>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
    </div>

    <!-- شبكة المحتوى -->
    <main class="content-area">
        <h2 class="section-title" id="gridTitle">الأفلام الرائجة الآن</h2>
        <div class="movies-grid" id="moviesGrid"></div>
    </main>

    <script>
        const TMDB_API_KEY = '2da39b910e34eeb919f6f92b25637d43';

        // تهيئة اتصال الـ SDK بديسكورد
        let discordSdk = null;
        if (window.DiscordSDK) {
            discordSdk = new window.DiscordSDK.DiscordSDK();
            discordSdk.ready().then(() => {
                console.log("Discord Embedded App SDK جاهز!");
            }).catch(console.error);
        }

        // جلب الأعمال الشائعة عند فتح الصفحة
        async function fetchTrending() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_API_KEY}&language=ar-SA`);
                const data = await res.json();
                renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        // البحث عن فيلم أو مسلسل
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=ar-SA`);
                const data = await res.json();
                renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        // رسم البطاقات
        function renderCards(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            items.filter(i => i.media_type !== 'person' && i.poster_path).forEach(item => {
                const isTv = item.media_type === 'tv' || (!item.title && item.name);
                const title = item.title || item.name;
                const year = (item.release_date || item.first_air_date || '').split('-')[0] || '----';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '0';

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${title}">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span>${isTv ? 'مسلسل' : 'فيلم'} • ${year}</span>
                            <span>⭐ ${rating}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => playMedia(item.id, isTv, title);
                grid.appendChild(card);
            });
        }

        // تشغيل الفيديو بسيرفر VidLink المترجم
        function playMedia(id, isTv, title) {
            const playerContainer = document.getElementById('player-container');
            const frame = document.getElementById('videoFrame');
            const titleElem = document.getElementById('currentPlayingTitle');

            titleElem.innerText = `🎬 تشغيل: ${title}`;
            // استخدام VidLink كمشغل مباشر
            const streamUrl = isTv 
                ? `https://vidlink.pro/tv/${id}/1/1`
                : `https://vidlink.pro/movie/${id}`;

            frame.src = streamUrl;
            playerContainer.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            const playerContainer = document.getElementById('player-container');
            const frame = document.getElementById('videoFrame');
            frame.src = '';
            playerContainer.style.display = 'none';
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        fetchTrending();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Cinema</title>
    <!-- تضمين مكتبة Discord SDK المعتمدة لفتح الروابط الخارجية -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.1.0/output/index.js"></script>
    <style>
        :root {
            --primary: #FF2228;
            --primary-hover: #B8202A;
            --bg-main: #0F0A0D;
            --bg-surface: #151316;
            --card-bg: #2B171D;
            --card-hover: #341920;
            --border-color: #5E3B46;
            --text-main: #FFF5F5;
            --text-muted: #D8CAD0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: linear-gradient(180deg, var(--bg-surface) 0%, rgba(15, 10, 13, 0.95) 100%);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 12px rgba(255, 34, 40, 0.4);
        }

        .search-box {
            display: flex;
            gap: 10px;
            width: 50%;
            max-width: 480px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--primary-hover);
        }

        #playback-banner {
            display: none;
            width: 100%;
            background: linear-gradient(180deg, var(--bg-surface) 0%, #000 100%);
            padding: 24px 28px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .banner-content {
            display: flex;
            gap: 24px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .banner-poster {
            width: 130px;
            height: 190px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            object-fit: cover;
            flex-shrink: 0;
        }

        .banner-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .banner-details h2 {
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .selectors-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .selectors-row select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            outline: none;
            font-weight: bold;
        }

        .play-btn {
            background: var(--primary);
            color: var(--text-main);
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(255, 34, 40, 0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .play-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.03);
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        .close-banner-btn {
            position: absolute;
            top: 16px;
            left: 24px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-banner-btn:hover {
            color: var(--primary);
        }

        .content-area {
            padding: 24px 28px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: var(--text-main);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, background 0.25s;
        }

        .movie-card:hover {
            transform: translateY(-6px);
            background: var(--card-hover);
            border-color: var(--primary);
        }

        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .movie-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .rating-badge {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍿 Orbit Cinema</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="performSearch()">بحث</button>
        </div>
    </header>

    <div id="playback-banner">
        <button class="close-banner-btn" onclick="closeBanner()">✕ إغلاق</button>
        <div class="banner-content">
            <img id="bannerPoster" class="banner-poster" src="" alt="Poster">
            <div class="banner-details">
                <h2 id="bannerTitle">عنوان العمل</h2>
                <div class="selectors-row">
                    <label>السيرفر:
                        <select id="serverSelect">
                            <option value="vidlink">سيرفر 1 (VidLink)</option>
                            <option value="vidsrc_icu">سيرفر 2 (VidSrc)</option>
                            <option value="autoembed">سيرفر 3 (AutoEmbed)</option>
                        </select>
                    </label>

                    <div id="tvSelectors" style="display:none; gap:10px;">
                        <label>الموسم: 
                            <select id="seasonSelect"></select>
                        </label>
                        <label>الحلقة: 
                            <select id="episodeSelect"></select>
                        </label>
                    </div>
                </div>

                <button id="streamLaunchBtn" onclick="launchStream()" class="play-btn">
                    ▶ تشغيل الآن بدقة عالية
                </button>
            </div>
        </div>
    </div>

    <main class="content-area">
        <h2 class="section-title" id="gridTitle">الأفلام والمسلسلات الرائجة الآن</h2>
        <div class="movies-grid" id="moviesGrid">
            <p style="color:var(--text-muted); padding:20px;">جاري تحميل العروض...</p>
        </div>
    </main>

    <script>
        let discordSdk = null;
        let currentMedia = { id: null, isTv: false, title: '', poster: '' };

        // تهيئة اتصال ديسكورد لتمكين فتح النوافذ الخارجية
        async function setupDiscord() {
            try {
                if (window.DiscordSDK) {
                    discordSdk = new window.DiscordSDK.DiscordSDK();
                    await discordSdk.ready();
                }
            } catch (err) {
                console.log("Discord SDK mode:", err);
            }
        }
        setupDiscord();

        function renderCards(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">لا توجد نتائج متاحة.</p>';
                return;
            }

            items.filter(i => i.media_type !== 'person' && i.poster_path).forEach(item => {
                const isTv = item.media_type === 'tv' || (!item.title && item.name);
                const title = item.title || item.name;
                const year = (item.release_date || item.first_air_date || '').split('-')[0] || '----';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '0';
                const posterUrl = `/api/image?path=${encodeURIComponent(item.poster_path)}`;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${posterUrl}" alt="${title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span>${isTv ? 'مسلسل' : 'فيلم'} • ${year}</span>
                            <span class="rating-badge">⭐ ${rating}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => selectMedia(item.id, isTv, title, posterUrl);
                grid.appendChild(card);
            });
        }

        async function loadMovies() {
            try {
                const res = await fetch('/api/trending');
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    renderCards(data.results);
                }
            } catch (err) {
                console.error("خطأ:", err);
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('gridTitle').innerText = `نتائج البحث عن: ${query}`;
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.results) renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        function selectMedia(id, isTv, title, poster) {
            currentMedia = { id, isTv, title, poster };
            
            document.getElementById('bannerTitle').innerText = title;
            document.getElementById('bannerPoster').src = poster;

            const tvSelectors = document.getElementById('tvSelectors');
            if (isTv) {
                tvSelectors.style.display = 'inline-flex';
                setupTvSelectors();
            } else {
                tvSelectors.style.display = 'none';
            }

            document.getElementById('playback-banner').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupTvSelectors() {
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');
            
            seasonSelect.innerHTML = '';
            for (let s = 1; s <= 15; s++) {
                seasonSelect.innerHTML += `<option value="${s}">الموسم ${s}</option>`;
            }

            episodeSelect.innerHTML = '';
            for (let e = 1; e <= 30; e++) {
                episodeSelect.innerHTML += `<option value="${e}">الحلقة ${e}</option>`;
            }
        }

        // تشغيل الرابط عبر بروتوكول ديسكورد الرسمي
        async function launchStream() {
            const server = document.getElementById('serverSelect').value;
            const season = document.getElementById('seasonSelect').value || 1;
            const episode = document.getElementById('episodeSelect').value || 1;

            let url = '';
            if (currentMedia.isTv) {
                if (server === 'vidlink') {
                    url = `https://vidlink.pro/tv/${currentMedia.id}/${season}/${episode}`;
                } else if (server === 'vidsrc_icu') {
                    url = `https://vidsrc.icu/embed/tv/${currentMedia.id}/${season}/${episode}`;
                } else {
                    url = `https://player.autoembed.cc/embed/tv/${currentMedia.id}/${season}/${episode}`;
                }
            } else {
                if (server === 'vidlink') {
                    url = `https://vidlink.pro/movie/${currentMedia.id}`;
                } else if (server === 'vidsrc_icu') {
                    url = `https://vidsrc.icu/embed/movie/${currentMedia.id}`;
                } else {
                    url = `https://player.autoembed.cc/embed/movie/${currentMedia.id}`;
                }
            }

            // محاولة الفتح عبر ديسكورد SDK الرسمي
            try {
                if (discordSdk && discordSdk.commands && discordSdk.commands.openExternalLink) {
                    await discordSdk.commands.openExternalLink({ url: url });
                    return;
                }
            } catch (e) {
                console.log("Discord open link fallback:", e);
            }

            // بديل للمتصفحات العادية
            window.open(url, '_blank');
        }

        function closeBanner() {
            document.getElementById('playback-banner').style.display = 'none';
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        loadMovies();
    </script>
</body>
</html>
